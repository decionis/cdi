name: Verify

# The pull-request gate. Runs the same `pnpm verify` a contributor runs locally,
# so a green local run means a green CI run.
#
# Every third-party action is pinned to a commit SHA rather than a tag. Tags are
# mutable; a governance product that resolves its build steps by moving reference
# undercuts its own supply-chain story.

on:
  push:
    branches: [master]
  # Deliberately unfiltered: a pull request targeting any base branch must run
  # this. Restricting to [master] means a stacked PR gets no CI at all, while
  # branch protection still reports "all checks passed".
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is the version
        # most contributors will actually be on. Test what we promise.
        node: ["20", "22"]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree,
        # so a dependency change cannot land without its lockfile.
        run: pnpm install --frozen-lockfile

      - name: Verify
        # format -> lint -> typecheck -> test -> build
        run: pnpm verify

      - name: Markdown links
        # Also enforced by the pre-commit hook, which `git commit --no-verify`
        # bypasses. This is the copy that cannot be skipped.
        #
        # Documentation is the product for a repository handed to reviewers, and
        # OpenSource.md once carried fifteen links resolving outside the
        # repository — including the ones to SECURITY.md and EvidencePack.md.
        if: matrix.node == '22'
        run: pnpm links:check
