name: CodeQL

# Static analysis for the JavaScript/TypeScript tree.
#
# The audit workflow tells us a dependency has a known advisory. CodeQL looks at
# the code we wrote — injection, unsafe deserialization, unvalidated redirects.
# Neither substitutes for the other.
#
# Requires GitHub Code Security to be enabled while this repository is private or
# internal; on a public repository it works with no entitlement. If the "Perform
# analysis" step fails with a 403, that entitlement is the reason.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Tuesdays 05:00 UTC. Offset from the Monday dependency audit so a bad week
    # arrives as two separate signals rather than one pile.
    - cron: "0 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the SARIF results
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: javascript-typescript
          # security-and-quality is noisier than the default security-extended
          # but catches the maintainability defects that turn into security ones.
          queries: security-and-quality

      - name: Perform analysis
        id: analyze
        # The analysis itself always runs. Only the SARIF upload needs the
        # entitlement, and it fails with:
        #   "Code Security must be enabled for this repository to use code scanning"
        # A check that cannot succeed teaches people to ignore CI, so this does
        # not fail the job — but the next step makes the gap loud rather than
        # letting it pass silently, which would be worse.
        #
        # REMOVE continue-on-error ONCE CODE SECURITY IS ENABLED, so that a real
        # analysis failure blocks again.
        continue-on-error: true
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          category: "/language:javascript-typescript"

      - name: Report analysis outcome
        run: |
          set -euo pipefail
          if [ "${{ steps.analyze.outcome }}" = "success" ]; then
            echo "CodeQL results uploaded to code scanning." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning title=CodeQL results were not uploaded::Code Security is not enabled for this repository, so code scanning rejected the SARIF upload. The analysis ran; nobody can see the results."
          {
            echo "### CodeQL did not publish results"
            echo
            echo "The analysis completed, but uploading to code scanning requires **GitHub Code"
            echo "Security**, which is not enabled for this repository. It is free on public"
            echo "repositories; on an internal or private one it needs the entitlement."
            echo
            echo "Until then this workflow burns CI minutes and surfaces nothing. Either enable"
            echo "Code Security, or disable this workflow and say so in OpenSource.md — a check"
            echo "that silently finds nothing is worse than no check."
          } >> "$GITHUB_STEP_SUMMARY"
