name: Scorecard

# OpenSSF Scorecard grades this repository's supply-chain posture against a
# published rubric — pinned dependencies, branch protection, token permissions,
# signed releases, CI tests, dangerous workflow patterns.
#
# The point is that it is somebody else's rubric. Procurement can cite a
# third-party number instead of taking our word for the posture, which is a
# large part of why open-sourcing this tier is worth doing at all.
#
# WHILE THIS REPOSITORY IS INTERNAL, THIS IS PREPARATORY.
#   - publish_results must stay false; publishing requires a public repository.
#   - There is no badge until the repository is public and publishing is on.
#   - Several checks (Branch-Protection, Signed-Releases, Contributors) return
#     limited or unknown results on a non-public repository.
# Flip publish_results to true in the same change that makes the repository
# public, then add the badge to README.md.

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    # Wednesdays 05:00 UTC — offset from the dependency audit (Mon) and CodeQL
    # (Tue) so the three signals arrive separately.
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # required by publish_results once enabled

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # See the note at the top of this file before changing.
          publish_results: false

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30

      - name: Upload to code scanning
        # Needs GitHub Code Security while the repository is internal or private.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: scorecard-results.sarif
