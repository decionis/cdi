version: 2

# Dependabot was running on defaults with no configuration, which produced four
# consecutive failed security-update jobs. This gives it the shape W2.3 of
# OpenSource.md asked for: grouped, weekly, and quiet enough that a Dependabot
# pull request is worth reading.
#
# Note what this file does NOT control: security updates. Those are driven by
# advisories rather than by schedule, and ignore `groups` and `schedule`. The
# way to stop a security update failing is to not have the vulnerable version.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

    groups:
      # Grouped by dependency type and update size rather than by package name.
      #
      # The previous pattern-based groups (next, react, linting, testing, types)
      # only covered packages someone had thought to list, so lucide-react, zod
      # and typescript each still opened their own pull request — five or six a
      # week for a repository this size. Matching on dependency-type catches
      # everything, including packages added later that nobody remembers to add
      # to a pattern list.
      #
      # Majors are deliberately left out of both groups. They land as individual
      # pull requests because they are the ones that actually need reading — the
      # vitest 2 -> 3 bump earlier in this repository's history is the example.
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
